<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyper funding</title>
<style>
:root{color-scheme:light;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#192521;background:#fafbf8}
*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:40px auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h1{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0}h2{font-size:12px;font-weight:500;color:#66746c;margin:0}
.muted{color:#66746c;font-size:12px}.notice{font-size:12px;color:#7c592d;margin:12px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:28px 0 8px}
.value{font-size:26px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:2px}.unit{font-size:12px;letter-spacing:0;color:#66746c;margin-left:5px}
.sub{font-size:12px;color:#66746c;margin:4px 0 0;display:flex;gap:8px;align-items:center;min-height:24px}.sub:empty{display:none}
section{margin-top:28px}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
th{text-align:right;color:#66746c;font-weight:400;font-size:12px;padding:6px 0;border-bottom:1px solid #dfe6dc;white-space:nowrap}
td{text-align:right;padding:7px 0;border-bottom:1px solid #eef1ea;white-space:nowrap}
th+th,td+td{padding-left:16px}th:first-child,td:first-child,#activity th:nth-child(2),#activity td:nth-child(2){text-align:left}
a{color:inherit;text-decoration:none;border-bottom:1px solid #cbd5c7}a:hover{border-color:#192521}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid #cbd5c7;border-radius:6px;background:#fff;color:#192521;cursor:pointer}
button.primary{background:#192521;border-color:#192521;color:#fff}button:disabled{opacity:.5;cursor:default}
footer{display:flex;gap:16px;margin-top:24px}
@media(max-width:600px){main{margin:24px auto;padding:0 16px}.stats{grid-template-columns:1fr;gap:14px}td,th{font-size:12px}}
</style>
<main>
<header><h1>Vyper funding</h1><span class="muted" id="updated"></span></header>
<p class="notice" id="demo" hidden>Illustrative data</p>
<div id="notices" role="status"></div>
<section class="stats" aria-label="Balances">
<div><h2>Funding</h2><div class="value"><span id="funding">—</span><span class="unit">USDC</span></div><p class="sub" id="next"></p></div>
<div><h2>Proceeds</h2><div class="value"><span id="proceeds">—</span><span class="unit">USDC</span></div></div>
<div><h2>Vyper CRV</h2><div class="value"><span id="vyper-crv">—</span><span class="unit">CRV</span></div><p class="sub"><button id="claim" type="button" hidden>Connect</button><span id="claim-status"></span></p></div>
</section>
<section id="weekly" hidden><h2>Weeks</h2><div class="scroll"><table><thead><tr><th scope="col">Week</th><th scope="col">Yearn share</th><th scope="col">Yearn</th><th scope="col">Vyper</th></tr></thead><tbody id="weeks"></tbody></table></div></section>
<section id="activity" hidden><h2>Transactions</h2><div class="scroll"><table><thead><tr><th scope="col">UTC</th><th scope="col">Action</th><th scope="col">CRV</th><th scope="col">Yearn</th><th scope="col">Vyper</th></tr></thead><tbody id="transactions"></tbody></table></div></section>
<footer class="muted" id="links"><a href="report.json">Data</a></footer>
</main>
<script>
const report=/*REPORT_DATA*/{};
const el = id => document.getElementById(id);
const big = x => BigInt(x ?? 0);
const amount = (x, d) => {
  const n = big(x), scale = 10n ** BigInt(d);
  return (n / scale).toLocaleString('en-US') + '.' + ((n % scale) * 100n / scale).toString().padStart(2, '0');
};
const bps = share => big(share) * 10000n / 10n ** 18n;
const pct = basis => amount(basis, 2) + '%';
const day = ts => new Date(Number(ts) * 1000).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', timeZone: 'UTC'});
const when = ts => day(ts) + ' ' + new Date(Number(ts) * 1000).toISOString().slice(11, 16);
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const split = (usdc, crv) => {
  const parts = [];
  if (big(usdc) > 0n) parts.push(amount(usdc, 6) + ' USDC');
  if (big(crv) > 0n) parts.push(amount(crv, 18) + ' CRV');
  return parts.join(' + ') || '—';
};
const row = (body, values) => {
  const tr = document.createElement('tr');
  for (const value of values) {
    const td = document.createElement('td');
    td.append(value);
    tr.append(td);
  }
  el(body).append(tr);
};

if (report.demo) el('demo').hidden = false;
if (report.as_of) el('updated').textContent = 'Updated ' + when(report.as_of) + ' UTC';
for (const warning of report.warnings ?? []) {
  const p = document.createElement('p');
  p.className = 'notice';
  p.textContent = warning;
  el('notices').append(p);
}
if (report.funding_assets != null) {
  el('funding').textContent = amount(report.funding_assets, 6);
  el('proceeds').textContent = amount(report.proceeds_balance, 6);
  el('vyper-crv').textContent = amount(report.vyper_crv_balance, 18);
}
if (big(report.funding_next_week) > 0n) {
  el('next').textContent = 'Next ' + amount(report.funding_payments?.[0], 6) + ' · ' + day(report.funding_next_week);
}

for (const week of [...report.weeks ?? []].reverse()) {
  row('weeks', [
    day(week.week),
    week.ready ? pct(bps(week.share)) : '—',
    split(week.yearn, 0),
    split(big(week.output) - big(week.yearn), week.vyper_crv),
  ]);
}
el('weekly').hidden = !(report.weeks ?? []).length;

for (const t of report.transactions ?? []) {
  if (!/^0x[0-9a-fA-F]{64}$/.test(t.tx ?? '')) continue;
  const link = document.createElement('a');
  link.href = 'https://etherscan.io/tx/' + t.tx;
  link.textContent = when(t.timestamp);
  if (t.kind === 'work') {
    row('transactions', [link, 'Work', amount(t.crv, 18), split(t.yearn_usdc, 0), split(t.vyper_usdc, t.vyper_crv)]);
  } else if (t.kind === 'checkpoint') {
    const yearn = bps(t.share);
    row('transactions', [link, t.manual ? 'Manual weight' : 'Checkpoint', '—', pct(yearn), pct(10000n - yearn)]);
  } else if (t.kind === 'payment') {
    row('transactions', [link, 'Payment', '—', '—', split(t.usdc, 0)]);
  }
}
el('activity').hidden = !el('transactions').children.length;

for (const [key, label] of [['funding', 'Funding'], ['proceeds', 'Proceeds']]) {
  if (!/^0x[0-9a-fA-F]{40}$/.test(report[key] ?? '')) continue;
  const a = document.createElement('a');
  a.href = 'https://etherscan.io/address/' + report[key];
  a.textContent = label;
  el('links').append(a);
}

// Only the Vyper Safe may withdraw escrow CRV, so the wallet must act as that Safe.
const claim = report.vyper_crv_claim;
const button = el('claim');
const status = message => { el('claim-status').textContent = message; };
let account = null;
const isSafe = () => account?.toLowerCase() === claim.safe.toLowerCase();
const show = () => {
  button.textContent = isSafe() ? 'Claim' : 'Connect';
  button.classList.toggle('primary', isSafe());
  status(account && !isSafe() ? short(account) + ' is not the Vyper multisig' : '');
};
const mainnet = async () => {
  const wallet = window.ethereum;
  if (!wallet) throw new Error('No browser wallet');
  if (await wallet.request({method: 'eth_chainId'}) !== '0x1') {
    await wallet.request({method: 'wallet_switchEthereumChain', params: [{chainId: '0x1'}]});
    if (await wallet.request({method: 'eth_chainId'}) !== '0x1') throw new Error('Switch to Ethereum mainnet');
  }
  return wallet;
};
if (claim && big(report.vyper_crv_balance) > 0n) {
  button.hidden = false;
  window.ethereum?.on?.('accountsChanged', accounts => { account = accounts[0] ?? null; show(); });
  button.onclick = async () => {
    button.disabled = true;
    try {
      const wallet = await mainnet();
      if (!isSafe()) {
        [account] = await wallet.request({method: 'eth_requestAccounts'});
        show();
      } else {
        const hash = await wallet.request({
          method: 'eth_sendTransaction',
          params: [{from: claim.safe, to: claim.to, data: claim.data, value: '0x0'}],
        });
        status('Submitted ' + short(hash));
      }
    } catch (error) {
      status(error?.message ?? String(error));
    } finally {
      button.disabled = false;
    }
  };
}
</script>
</html>
